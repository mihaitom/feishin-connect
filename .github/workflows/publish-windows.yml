name: Publish Windows (Manual)

on: workflow_dispatch

jobs:
    # See publish.yml's ensure-release job for why this exists: electron-builder's
    # lookup-then-create check for the release draft isn't atomic, so triggering
    # this alongside another platform's publish workflow around the same time
    # can otherwise create a duplicate draft holding only this platform's assets.
    ensure-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout git repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - name: Read version
              id: version
              run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
            - name: Ensure draft release exists
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="v${{ steps.version.outputs.value }}"
                  gh release view "$TAG" --repo "${{ github.repository }}" \
                      || gh release create "$TAG" --repo "${{ github.repository }}" \
                          --title "${{ steps.version.outputs.value }}" --draft --notes ""

    publish:
        needs: ensure-release
        runs-on: ${{ matrix.os }}

        # Required so electron-builder's `--publish always` can create the release
        permissions:
            contents: write

        # x64 and arm64 each build on their own native runner — same reasoning as
        # publish-linux.yml: the bundled Connect backend binary is built by
        # PyInstaller during `pnpm run build` and can't be cross-compiled. Windows
        # on ARM does have a built-in x64 emulation layer (unlike Linux), so the
        # old single-runner build wasn't a hard failure like Linux's was — just a
        # connect-server.exe running under emulation instead of natively. This
        # gets it running natively instead. UNVERIFIED: no way to test a Windows
        # ARM64 build locally (unlike the Linux fix, which was verified against a
        # real emulated build) — watch the Actions run for this leg specifically.
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      script: publish:win
                    - os: windows-11-arm
                      script: publish:win-arm64

        steps:
            - name: Checkout git repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Install Node and PNPM
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            # Required for build:connect (`uv run connect/packaging/build-binary.py`).
            # uv installs the required Python version itself.
            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

            # miniaudio (a pyatv/AirPlay dependency) has no prebuilt wheel for
            # Windows ARM64 (only win32/win_amd64) — `uv sync` (invoked by
            # build:connect) has to compile it from source there, which needs an
            # MSVC toolchain on PATH. Not needed on windows-latest (x64 has a
            # prebuilt wheel), so gated to just the arm64 leg.
            - name: Set up MSVC toolchain (arm64 native compile)
              if: matrix.os == 'windows-11-arm'
              uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
              with:
                  arch: arm64

            - name: Install dependencies
              run: pnpm install

            - name: Build and Publish releases
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: |
                      pnpm run ${{ matrix.script }}
                  on_retry_command: pnpm cache delete
