services:
    feishin:
        container_name: feishin
        image: "ghcr.io/mihaitom/feishin-connect:latest"
        restart: unless-stopped
        environment:
            - SERVER_NAME=jellyfin # pre-defined server name
            - SERVER_LOCK=false # When true AND name/type/url are set, only username/password can be toggled
            - SERVER_TYPE=jellyfin # the allowed types are: jellyfin, navidrome, subsonic. These values are case insensitive
            - SERVER_URL=http://localhost:8096 # http://address:port or https://address:port
            # - REMOTE_URL=http://share.localhost # Used for compatibility with external functionality, such as custom sharing URLs on Navidrome
            - LEGACY_AUTHENTICATION=false # When SERVER_LOCK is true, sets the legacyauth flag for server authentication (true or false)
            - ANALYTICS_DISABLED=false # Set to true to disable Umami analytics tracking
            # CONNECT_TOKEN secures the Connect API (casting control). Leave it unset —
            # a random one is generated on each container start, which is enough since
            # the browser never needs to know it (nginx injects it server-side). Only set
            # this if something needs to call the API directly, bypassing nginx, with a
            # token that survives restarts:
            # - CONNECT_TOKEN=SzArltWiDYl44aguM2qy5qQJAD15WV3MOIzsKGnvdXeGIn4kS5JHgVBrgfiUm6y5
            # - DEBUG=true # Verbose playback logs for ALL renderers (AirPlay + Sonos)
            # Only needed if 9180/9181 are already taken on the host — e.g. running
            # a second instance (prod + dev) at the same time:
            # - WEB_PORT=9180 # nginx / the Feishin web UI
            # - PORT=9181     # Connect API (Python backend)
        # Keeps AirPlay 2 pairings across container recreations/updates (default path, no env var needed)
        volumes:
            - ./data:/data
        # host networking is required for Sonos/AirPlay mDNS discovery
        network_mode: host
        # with host networking the ports below are bound directly — no mapping needed,
        # but kept here for documentation: nginx on 9180, connect API on 9181
        # ports:
        #     - 9180:9180
        #     - 9181:9181
